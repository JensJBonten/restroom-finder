spring.application.name=toilapp

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/toilapp}
spring.datasource.username=${DB_USERNAME:toilapp}
spring.datasource.password=${DB_PASSWORD:toilapp_dev}

# Flyway manages schema changes; Hibernate only validates the entity mapping.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Configuration for Oslo municipality's ArcGIS toilet layer.
toilapp.import.source-url=https://geodata.bymoslo.no/arcgis/rest/services/geodata/Temadata_Publikum/MapServer/4
toilapp.import.page-size=50
toilapp.import.connect-timeout=5s
toilapp.import.read-timeout=20s

# Import must be started explicitly and never runs during normal server startup.
toilapp.import.enabled=false