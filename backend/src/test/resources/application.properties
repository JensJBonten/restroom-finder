spring.datasource.url=jdbc:h2:mem:toilapp-test-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway creates the test schema; Hibernate only validates the entity mapping.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Keeps tests independent of the real external service.
toilapp.import.source-url=http://localhost
toilapp.import.page-size=50
toilapp.import.connect-timeout=5s
toilapp.import.read-timeout=20s
toilapp.import.enabled=false